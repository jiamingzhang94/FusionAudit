[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionaudit"
version = "1.0.0"
description = "Pixel and rendered-text robustness auditing for vision-language models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10", "datasets>=3.4", "num2words>=0.5.13"]

[project.optional-dependencies]
main = ["torch==2.10.0", "torchvision==0.25.0", "transformers==5.5.3", "accelerate==1.13.0", "sentencepiece==0.2.1", "einops==0.8.2", "timm==1.0.25"]
legacy = ["torch==2.10.0", "torchvision==0.25.0", "transformers==4.32.0", "accelerate==1.13.0", "sentencepiece==0.2.1", "einops==0.8.2", "timm==1.0.26", "tiktoken==0.12.0", "attrdict==2.0.1", "matplotlib==3.10.8"]
generation = ["google-genai==1.73.1"]
planning = ["torch==2.10.0", "transformers==5.5.3", "sentence-transformers==5.3.0", "InstructorEmbedding==1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fusionaudit.data" = ["fonts/*.ttf", "fonts/LICENSE*.txt"]
